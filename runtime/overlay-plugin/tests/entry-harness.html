<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>RPG-Translator Entry Harness</title>
  </head>
  <body>
    <div id="status">running</div>
    <script>
      window.RPGTranslatorDisableAutoInstall = true;
    </script>
    <script src="../RPGTranslator.js"></script>
    <script>
      (async () => {
        const root = window;
        const loaded = [];
        const baseUrl = 'file:///game/js/plugins/rpg-translator/';
        root.Utils = { RPGMAKER_NAME: 'MZ' };
        root.RPGTranslatorOverlay.Boot = {
          async install(scope, options) {
            loaded.push(['boot', options.baseUrl, options.engine]);
            scope.bootOptions = options;
            return { installed: true };
          },
        };

        await root.RPGTranslatorOverlay.RuntimeEntry.install(root, {
          baseUrl,
          loadScript: async (url) => {
            loaded.push(url);
          },
        });

        const expected = [
          `${baseUrl}runtime/text-codec.js`,
          `${baseUrl}runtime/runtime-miss-logger.js`,
          `${baseUrl}runtime/lookup-index.js`,
          `${baseUrl}runtime/render-guard.js`,
          `${baseUrl}runtime/wrapping.js`,
          `${baseUrl}runtime/runtime-diagnostics.js`,
          `${baseUrl}runtime/replay-state.js`,
          `${baseUrl}runtime/text-orchestrator/orchestrator.js`,
          `${baseUrl}runtime/text-orchestrator/adapter-contract.js`,
          `${baseUrl}runtime/foresight-scanner.js`,
          `${baseUrl}runtime/cache-loader.js`,
          `${baseUrl}adapters/game-message/message-adapter.js`,
          `${baseUrl}adapters/window-text/window-text-adapter.js`,
          `${baseUrl}adapters/bitmap-text/bitmap-text-adapter.js`,
          `${baseUrl}adapters/sprite-text/sprite-text-adapter.js`,
          `${baseUrl}adapters/pixi-text/pixi-text-adapter.js`,
          `${baseUrl}runtime/startup-toast.js`,
          `${baseUrl}runtime/boot.js`,
          ['boot', baseUrl, 'mz'],
        ];
        document.querySelector('#status').textContent =
          JSON.stringify(loaded) === JSON.stringify(expected) ? 'pass' : `fail ${JSON.stringify(loaded)}`;
      })().catch((error) => {
        document.querySelector('#status').textContent = `fail ${error.message}`;
      });
    </script>
  </body>
</html>
