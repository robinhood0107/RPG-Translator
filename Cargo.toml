[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/cli",
    "crates/core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/robinhood0107/RPG-Translator"
version = "0.1.0"

[workspace.dependencies]
hex = "0.4"
rpg-translator-core = { path = "crates/core" }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
